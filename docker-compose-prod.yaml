services:
  mongodb:
    image: mongo:6.0
    container_name: nammongodb
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - product-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (db.adminCommand('ping').ok !== 1) quit(1)"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 40s

  product-api:
    image: trinhmyloan/product-api:latest
    container_name: product-api-prod
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/productdb
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - product-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongodb-data:
    external: true
    name: nammongodb-data

networks:
  product-network:
    driver: bridge
