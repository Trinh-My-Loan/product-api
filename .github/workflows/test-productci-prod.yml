name: Product API Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-crud:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' "
          --health-interval 15s
          --health-timeout 20s
          --health-retries 10
          --health-start-period 40s

    env:
      PORT: 3000
      MONGO_URI: mongodb://127.0.0.1:27017/productdb

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check models/Product.js
          node --check controllers/productController.js
          node --check routes/productRoutes.js
          node --check scripts/test-crud.js

      - name: Start Product API
        run: |
          node server.js > api.log 2>&1 &
          echo $! > api.pid

      - name: Wait for API healthcheck
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              echo ""
              echo "Product API is healthy"
              exit 0
            fi
            echo "Waiting for Product API..."
            sleep 2
          done
          cat api.log
          exit 1

      - name: Test Product CRUD
        run: node scripts/test-crud.js

      - name: Show API logs on failure
        if: failure()
        run: cat api.log || true
