version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: nammongodb-prod
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - product-net

  product-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: product-api:1.0
    container_name: product-service
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://nammongodb-prod:27017/productdb
    depends_on:
      - mongodb
    networks:
      - product-net

volumes:
  mongo-data:

networks:
  product-net:
    driver: bridge