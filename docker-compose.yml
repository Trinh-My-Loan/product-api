services:
  mongodb:
    image: mongo:6.0
    container_name: nammongodb
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - product-network
    restart: unless-stopped

  product-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: product-api:1.0
    container_name: product-api-compose
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/productdb
    depends_on:
      - mongodb
    networks:
      - product-network
    restart: unless-stopped

volumes:
  mongodb-data:
    external: true
    name: nammongodb-data

networks:
  product-network:
    driver: bridge
