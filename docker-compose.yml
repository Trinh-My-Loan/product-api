version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: nammongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - nammongodb_data:/data/db
    networks:
      - product-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    container_name: product-api-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/productdb
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - product-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  nammongodb_data:

networks:
  product-net:
    driver: bridge
